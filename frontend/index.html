<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoVenue · Cerca d'Espais Sostenibles</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
    .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
    .badge { background: #e2f5ea; color: #157347; padding: 0.2rem 0.5rem; border-radius: 4px; font-weight: bold; }
    .status { padding: 0.5rem; background: #f8f9fa; margin-bottom: 1rem; border-radius: 4px; border-left: 4px solid #0d6efd; }
    form { background: #f1f3f5; padding: 1rem; border-radius: 8px; display: flex; flex-direction: column; gap: 0.8rem; }
    input, select, button { padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { background: #198754; color: white; font-weight: bold; cursor: pointer; border: none; }
    .msg { padding: 0.5rem; border-radius: 4px; display: none; }
    .msg.ok { background: #d1e7dd; color: #0f5132; display: block; }
    .msg.error { background: #f8d7da; color: #842029; display: block; }
  </style>
</head>
<body>
  <!-- 1. Títol Principal -->
  <h1>EcoVenue · Catàleg d'Espais</h1>
  
  <!-- 2. Banner d'estat de la connexió -->
  <div id="api-status" class="status">Comprovant connexió amb el backend...</div>

  <!-- 3. Dashboard de Mètriques (KPIs) -->
  <div id="kpi-container" style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
    <div class="card" style="flex: 1; text-align: center; margin-bottom: 0;">
      <h4 style="margin:0; color: #555;">Reserves Totals</h4>
      <p id="kpi-reserves" style="font-size: 1.8rem; font-weight: bold; margin: 0.5rem 0 0 0;">0</p>
    </div>
    <div class="card" style="flex: 1; text-align: center; margin-bottom: 0;">
      <h4 style="margin:0; color: #555;">Facturació Total</h4>
      <p id="kpi-facturacio" style="font-size: 1.8rem; font-weight: bold; margin: 0.5rem 0 0 0;">0.00 €</p>
    </div>
    <div class="card" style="flex: 1; text-align: center; margin-bottom: 0;">
      <h4 style="margin:0; color: #555;">Impacte CO₂ Registrat</h4>
      <p id="kpi-co2" style="font-size: 1.8rem; font-weight: bold; margin: 0.5rem 0 0 0; color: #157347;">0.00 kg</p>
    </div>
  </div>

  <!-- 4. Catàleg d'Espais -->
  <h2>Espais disponibles</h2>
  <div id="llista-espais">Carregant espais...</div>

  <!-- 5. Formulari de Reserva -->
  <h2>Realitzar una Reserva</h2>
  <form id="form-reserva">
    <label>Espai:</label>
    <select id="reserva-espai" required>
      <option value="">Carregant espais...</option>
    </select>

    <label>Data:</label>
    <input type="date" id="reserva-data" required>

    <label>Hores:</label>
    <input type="number" id="reserva-hores" min="1" max="12" value="2" required>

    <label>Email de contacte:</label>
    <input type="email" id="reserva-email" placeholder="usuari@empresa.com" required>

    <button type="submit">Confirmar Reserva</button>
  </form>

  <div id="missatge-reserva" class="msg"></div>

  <script src="app.js"></script>
</body>
</html>

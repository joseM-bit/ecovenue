version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ecovenue_db_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecovenue
    ports:
      - "3307:3306"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecovenue_api_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: ecovenue_db_container
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: ecovenue
    depends_on:
      - db

volumes:
  mysqldata:
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecovenue_db_container
    restart: always
    environment:
      POSTGRES_USER: ecovenue_user
      POSTGRES_PASSWORD: ecovenue_pass_123
      POSTGRES_DB: ecovenue_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql # Ejecuta el esquema DDL al iniciar
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecovenue_user -d ecovenue_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecovenue_api_container
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_URL: postgres://ecovenue_user:ecovenue_pass_123@postgres:5432/ecovenue_db
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
